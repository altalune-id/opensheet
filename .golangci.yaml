version: "2"

# Run locally:  golangci-lint run --timeout=3m ./...

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose         # HTTP response body must be closed
    - depguard          # architectural boundary enforcement
    - errorlint         # detects common error-wrap mistakes (%w usage, errors.Is/As)
    - forbidigo         # forbid specific function calls (fmt.Print*, slog default)
    - gochecknoglobals  # warn on package-level variable state
    - gocritic          # opinionated but catches real bugs
    - gosec             # security scanner (SQL injection, weak crypto, path traversal)
    - misspell          # spelling in comments/strings
    - nilerr            # returning nil on non-nil err path (or vice versa)
    - prealloc          # slice preallocation hints — cheap perf wins
    - revive            # replacement for golint; broad style checker
    - unconvert         # redundant type conversions
    - unparam           # unused function params (excluding interface implementations)
    - whitespace        # misplaced whitespace

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain     # legitimate readability choice in switches
        - hugeParam       # false positives on Config structs
        - rangeValCopy    # false positives on small structs
    gosec:
      excludes:
        - G104            # duplicates errcheck
        - G404            # weak random OK for non-crypto uses (invite-token uses crypto/rand explicitly)
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unexported-return
          disabled: true   # constructors returning *unexported are our pattern (New returns *S)
        - name: var-naming
          disabled: false
        - name: error-return
          disabled: false
        - name: error-naming
          disabled: false
        - name: error-strings
          disabled: false
        - name: dot-imports
          disabled: false
        - name: blank-imports
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: context-keys-type
          disabled: false
        - name: increment-decrement
          disabled: false
        - name: range
          disabled: false
        - name: receiver-naming
          disabled: false
        - name: superfluous-else
          disabled: false
        - name: unreachable-code
          disabled: false
        - name: redefines-builtin-id
          disabled: false
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    depguard:
      rules:
        domain-purity:
          list-mode: strict
          files:
            - "**/internal/*/todo.go"
            - "**/internal/*/user.go"
            - "**/internal/*/org.go"
            - "**/internal/*/project.go"
            - "**/internal/*/invite.go"
            - "**/internal/*/auth.go"
            - "**/internal/onboard/onboard.go"
            - "**/internal/*/blog.go"
            - "**/internal/*/webhook.go"
            - "**/internal/*/credential.go"
            - "**/internal/*/spreadsheet.go"
            - "**/internal/*/sheet.go"
            - "**/internal/blog/*/{category,tag,store,errors}.go"
            - "**/internal/*/store.go"
            - "**/internal/*/errors.go"
            # Cobra command files, not domains, despite colliding names.
            - "!**/internal/cli/*.go"
            # TODO: define a local principal type in auth and drop the platform/session import.
            - "!**/internal/auth/auth.go"
            # Surface S3, not a domain package.
            - "!**/internal/dataplane/*.go"
            # Surface S7, not a domain package.
            - "!**/internal/mcp/auth.go"
          allow:
            - $gostd
            - github.com/google/uuid
            - altalune.id/opensheet/internal/platform/tenant
            - altalune.id/opensheet/internal/platform/events
            - altalune.id/opensheet/internal/apperror
            - altalune.id/opensheet/gen/go/apperror/v1
            - altalune.id/opensheet/reqid
            - google.golang.org/grpc/codes
        scheduler-purity:
          list-mode: strict
          files:
            - "**/scheduler/*.go"
            - "!**/scheduler/*_test.go"
          allow:
            - $gostd
            - go.opentelemetry.io/otel
            - github.com/robfig/cron/v3
            - altalune.id/opensheet/reqid
        httpclient-purity:
          list-mode: strict
          files:
            - "**/httpclient/*.go"
            - "!**/httpclient/*_test.go"
          allow:
            - $gostd
            - github.com/go-resty/resty/v2
            - go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp
        application-purity:
          list-mode: lax
          files:
            - "**/internal/*/service.go"
            - "**/internal/*/onboard.go"
            - "**/internal/*/accept.go"
            - "**/internal/*/send.go"
          deny:
            - pkg: "database/sql"
              desc: "application layer must not touch database/sql; use Store"
            - pkg: "net/http"
              desc: "application layer must not touch HTTP directly"
        platform-boundary:
          list-mode: lax
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: "altalune.id/opensheet/internal/todo"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/user"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/org"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/project"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/invite"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/auth"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/credential"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/spreadsheet"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/sheet"
              desc: "platform must not import domain packages"
            - pkg: "altalune.id/opensheet/internal/api"
              desc: "platform must not import interfaces"
            - pkg: "altalune.id/opensheet/internal/web"
              desc: "platform must not import interfaces"
            - pkg: "altalune.id/opensheet/internal/cli"
              desc: "platform must not import interfaces"
            - pkg: "altalune.id/opensheet/internal/boot"
              desc: "platform must not import boot"
        platform-boundary-root:
          list-mode: lax
          files:
            - "**/reqid/**"
            - "**/nanoid/**"
            - "**/slug/**"
            - "**/worker/**"
            - "**/logger/**"
            - "**/telemetry/**"
            - "**/mailer/**"
            - "**/httpclient/**"
            - "**/gworkspace/**"
            - "**/mcp/**"
            # Only the root mcp/ package is in scope here.
            - "!**/internal/mcp/**"
          deny:
            - pkg: "altalune.id/opensheet/internal"
              desc: "root-level shared packages must NOT depend on any internal/ package (import inversion)"
        mcp-purity:
          list-mode: strict
          files:
            - "**/mcp/*.go"
            - "!**/internal/mcp/*.go"
            - "!**/mcp/*_test.go"
          allow:
            - $gostd
            - github.com/modelcontextprotocol/go-sdk
    forbidigo:
      forbid:
        - pattern: 'fmt\.Print(f|ln|)\('
          msg: "use cmd.OutOrStdout() or slog for output"
        - pattern: 'slog\.(Info|Warn|Error|Debug)Context\('
          msg: "use an injected *slog.Logger, not the slog default"
      exclude-godoc-examples: true
      analyze-types: true

  exclusions:
    generated: strict
    warn-unused: false
    rules:
      # NOTE: only the template blog module called scopeToActiveProject; opensheet keeps reach.go byte-identical.
      - path: internal/controlplane/reach\.go
        text: "scopeToActiveProject|ProjectUnresolvedError"
        linters:
          - unused
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
          - prealloc
          - unparam
      - path: gen/
        linters:
          - all
      - path: _templ\.go
        linters:
          - all
      - path: cmd/opensheet/main\.go
        linters:
          - forbidigo
          - gochecknoglobals
      - path: internal/cli/render/
        linters:
          - forbidigo
        text: "fmt\\.Print"
      # NOTE: -ldflags -X can only stamp package-level vars.
      - path: version/version\.go
        linters:
          - gochecknoglobals
      # httpclient/safe.go holds the immutable SSRF deny-prefix table.
      - path: httpclient/safe\.go
        linters:
          - gochecknoglobals

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - altalune.id/opensheet

issues:
  # 0 means no cap on reported issues.
  max-issues-per-linter: 0
  max-same-issues: 0
