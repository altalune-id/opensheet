webhooks.guide_heading: "طريقة الربط"
webhooks.guide_intro: "اربط المستقبِل الخاص بك في دقائق. كل تسليم هو طلب POST بصيغة JSON وموقّع يُرسل إلى عنوانك."
webhooks.guide_step_url: "انقر على نقطة نهاية جديدة وأدخل عنوان https:// الذي سيستقبل الأحداث."
webhooks.guide_step_events: "اختر الأحداث التي تريد الاشتراك فيها، ثم احفظ."
webhooks.guide_step_secret: "انسخ سر التوقيع. يُعرض مرة واحدة فقط، لذا احفظه حيث يمكن للمستقبِل قراءته."
webhooks.guide_step_verify: "تحقّق من توقيع كل طلب. تحتوي صفحة نقطة النهاية على شيفرة جاهزة للنسخ بلغات Go وNode.js وPython."
webhooks.guide_step_test: "في صفحة نقطة النهاية، انقر على إرسال تجربة لتسليم حدث ping."
webhooks.guide_step_inspect: "في قسم أحدث عمليات التسليم، انقر على التفاصيل لرؤية الحمولة كما أُرسلت وترويساتها وكل محاولة."
webhooks.guide_step_retry: "أصلح المستقبِل، ثم أعد محاولة التسليم الفاشل، أو أعد محاولة كل ما فشل دفعة واحدة."
webhooks.guide_receiver_heading: "قائمة التحقق للمستقبِل"
webhooks.guide_respond: "أجب برمز حالة 2xx بسرعة، ثم نفّذ العمل. أي رمز آخر أو إعادة توجيه أو انتهاء مهلة يُعدّ فشلًا."
webhooks.guide_dedupe: "قد يصل التسليم نفسه أكثر من مرة. أزل التكرار اعتمادًا على هذه الترويسة؛ قيمتها لا تتغير عند إعادة المحاولة:"
webhooks.guide_correlate: "كل نقطة نهاية تستقبل الحدث نفسه تحصل على القيمة نفسها في:"
webhooks.guide_retries: "يُعاد التسليم الفاشل تلقائيًا، حتى {{.Attempts}} محاولات خلال نحو {{.TotalHours}} ساعة: أول انتظار {{.FirstSeconds}} ثانية، وأطوله {{.LongestHours}} ساعات."
webhooks.verify_heading: "التحقق من التواقيع"
webhooks.verify_intro: "احسب HMAC-SHA256 على الطابع الزمني ثم نقطة ثم جسم الطلب الخام، بمفتاح هو سر التوقيع كاملًا بما فيه البادئة whsec_. قارن الناتج بصيغة ست عشرية بأحرف صغيرة مسبوقة بـ v1= مع كل قيمة في ترويسة التوقيع مقارنةً ثابتة الزمن، وارفض أي طابع زمني يبتعد عن ساعتك أكثر من 5 دقائق."
webhooks.verify_headers_label: "الترويسات المطلوب قراءتها:"
webhooks.verify_env: "تقرأ الأمثلة السر من OPENSHEET_WEBHOOK_SECRET وتوقّع الجسم كما وصل تمامًا، قبل أي تحليل لـ JSON."
webhooks.verify_copy: "نسخ الشيفرة"
