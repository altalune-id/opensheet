syntax = "proto3";

package credential.v1;

import "google/protobuf/timestamp.proto";

option go_package = "altalune.id/opensheet/gen/go/credential/v1;credentialv1";

service CredentialService {
  rpc List(ListRequest) returns (ListResponse);
  rpc UploadServiceAccount(UploadServiceAccountRequest) returns (UploadServiceAccountResponse);
  rpc StartGoogleConnect(StartGoogleConnectRequest) returns (StartGoogleConnectResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// SECURITY: no field of this message may ever carry sealed material or a plaintext secret.
message Credential {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string kind = 4;
  string status = 5;
  string google_account_email = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListRequest {
  string project_id = 1;
}

message ListResponse {
  repeated Credential credentials = 1;
}

message UploadServiceAccountRequest {
  string project_id = 1;
  string name = 2;
  bytes service_account_json = 3;
}

message UploadServiceAccountResponse {
  Credential credential = 1;
}

message StartGoogleConnectRequest {
  string project_id = 1;
  string return_to = 2;
}

message StartGoogleConnectResponse {
  string authorization_url = 1;
}

message DeleteRequest {
  string project_id = 1;
  string credential_id = 2;
}

message DeleteResponse {}
