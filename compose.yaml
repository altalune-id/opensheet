name: opensheet

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensheet
      POSTGRES_PASSWORD: opensheet
      POSTGRES_DB: opensheet
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensheet -d opensheet"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web UI at http://localhost:8025

  opensheet:
    build:
      context: .
      args:
        VERSION: dev
        COMMIT: local
        BUILD_TIME: unknown
    image: opensheet:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "5150:5150"
    environment:
      OPENSHEET_MODE: selfhosted
      OPENSHEET_HTTP_ADDR: "0.0.0.0:5150"

      OPENSHEET_DB_DRIVER: postgres
      OPENSHEET_DB_DSN: "postgres://opensheet:opensheet@postgres:5432/opensheet?sslmode=disable"
      OPENSHEET_DB_ALLOW_BYPASS_RLS: "true"
      OPENSHEET_DB_AUTO_MIGRATE: "true"

      OPENSHEET_MAIL_DRIVER: smtp
      OPENSHEET_MAIL_FROM: "no-reply@opensheet.local"
      OPENSHEET_MAIL_SMTP_HOST: mailpit
      OPENSHEET_MAIL_SMTP_PORT: "1025"
      OPENSHEET_MAIL_SMTP_USER: ""
      OPENSHEET_MAIL_SMTP_PASS: ""
      OPENSHEET_MAIL_SMTP_TLS: "false"

      OPENSHEET_GENESIS_EMAIL: admin@opensheet.local
      OPENSHEET_GENESIS_PASSWORD: change-me
    healthcheck:
      test: ["CMD", "/opensheet", "healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
