syntax = "proto3";

package opensheettest.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/opensheet/cmd/protoc-gen-mcp/internal/gen/testdata/gen/opensheettest/v1;opensheettestv1";

service BadNameService {
  rpc ShoutLoudly(BadNameRequest) returns (BadNameResponse) {
    option (mcp.v1.tool) = {name: "Shout-Loudly"};
  }
}

message BadNameRequest {}

message BadNameResponse {}
